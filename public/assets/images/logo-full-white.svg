<svg xmlns="http://www.w3.org/2000/svg" width="280" height="60" viewBox="0 0 280 60">
  <defs>
    <!-- Degradado metálico claro -->
    <linearGradient id="bellGradientDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8f1ff"></stop>
      <stop offset="100%" stop-color="#4fd1ff"></stop>
    </linearGradient>

    <!-- Sombra suave para dark mode -->
    <filter id="bellShadowDark" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.55"></feDropShadow>
    </filter>
  </defs>

  <!-- Campana de recepción clara -->
  <g filter="url(#bellShadowDark)" stroke="#2cbce9" stroke-width="1" fill="url(#bellGradientDark)">
    <!-- Cuerpo -->
    <path d="M18 40c0-8 12-18 24-18s24 10 24 18H18z" rx="3"></path>
    <!-- Base -->
    <rect x="18" y="40" width="48" height="4" rx="2" fill="#2cbce9"></rect>
    <!-- Botón superior -->
    <circle cx="42" cy="22" r="4" fill="#e6faff"></circle>
  </g>

  <!-- Texto -->
  <text x="75" y="38" font-family="Georgia, serif" font-size="24" font-weight="bold" letter-spacing="1" fill="#e6faff">
    ComandaPro
  </text>
</svg>
