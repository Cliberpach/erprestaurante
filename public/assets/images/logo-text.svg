<!-- Texto ComandaPro - Solo Texto -->
<svg width="170" height="60" viewBox="0 0 280 60" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Gradiente celeste para texto Pro -->
        <linearGradient id="textGradientPro" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
        </linearGradient>
    </defs>
    
    <!-- Texto "Comanda" -->
    <text x="0" y="40" 
          font-family="Arial, Helvetica, sans-serif" 
          font-size="38" 
          font-weight="700" 
          fill="#1E3A8A">Comanda</text>
    
    <!-- Texto "Pro" -->
    <text x="172" y="40" 
          font-family="Arial, Helvetica, sans-serif" 
          font-size="38" 
          font-weight="700" 
          fill="url(#textGradientPro)">Pro</text>
</svg>
