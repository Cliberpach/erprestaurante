<svg xmlns="http://www.w3.org/2000/svg" width="280" height="60" viewBox="0 0 280 60">
  <defs>
    <!-- Degradado metálico -->
    <linearGradient id="bellGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00b0f0" stop-opacity="0.9"></stop>
      <stop offset="100%" stop-color="#005f80"></stop>
    </linearGradient>

    <!-- Sombra sutil -->
    <filter id="bellShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-opacity="0.25"></feDropShadow>
    </filter>
  </defs>

  <!-- Campana de recepción (angosta) -->
  <g filter="url(#bellShadow)" stroke="#004c66" stroke-width="1" fill="url(#bellGradient)">
    <!-- Cuerpo -->
    <path d="M18 40c0-8 12-18 24-18s24 10 24 18H18z" rx="3"></path>
    <!-- Base -->
    <rect x="18" y="40" width="48" height="4" rx="2" fill="#004c66"></rect>
    <!-- Botón superior -->
    <circle cx="42" cy="22" r="4" fill="#0077a3"></circle>
  </g>

  <!-- Texto -->
  <text x="75" y="38" font-family="Georgia, serif" font-size="24" font-weight="bold" letter-spacing="1" fill="#00b0f0">
    ComandaPro
  </text>
</svg>
